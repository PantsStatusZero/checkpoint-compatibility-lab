name: Encrypted raw SMILES identity transport
on:
  push:
    branches: [main]
    paths:
      - "tools/export_raw_smiles_identity_encrypted.py"
      - ".github/workflows/raw-smiles-identity-encrypted.yml"
      - "keys/candidate-index-materialization-public.pem"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "requests==2.32.5" "pyarrow==21.0.0" "cryptography==46.0.2" "rdkit==2026.3.3"
      - run: python tools/export_raw_smiles_identity_encrypted.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw-smiles-identity-envelope
          path: |
            results/raw-smiles-identity.cipher
            results/raw-smiles-identity-manifest.json
          compression-level: 0
          retention-days: 1
