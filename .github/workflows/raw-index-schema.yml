name: Public raw-index schema

on:
  push:
    branches: [main]
    paths:
      - "tools/casmi_raw_index_schema.py"
      - ".github/workflows/raw-index-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "requests==2.32.5" "pyarrow==21.0.0"
      - run: python tools/casmi_raw_index_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw-index-schema
          path: results/raw-index-schema.json
