name: CASMI public derivative schema probe
on:
  push:
    branches: [main]
    paths:
      - "tools/probe_casmi_raw_index_schema.py"
      - ".github/workflows/casmi-raw-index-schema.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "requests==2.32.5" "pyarrow==21.0.0"
      - run: python tools/probe_casmi_raw_index_schema.py
