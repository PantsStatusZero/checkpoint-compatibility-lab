name: E00 official source identity

on:
  push:
    branches: [main]
    paths:
      - "tools/e00_official_source_capture.py"
      - ".github/workflows/e00-source-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Kaggle scorer source identity / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "requests==2.32.5"
      - run: python tools/e00_official_source_capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: e00-source-identity-py${{ matrix.python-version }}
          path: results/e00-kaggle-pull-structure.json
