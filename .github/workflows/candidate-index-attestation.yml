name: Candidate index receipt attestation

on:
  push:
    branches: [main]
    paths:
      - "tools/verify_candidate_index_receipt.py"
      - ".github/workflows/candidate-index-attestation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  attest:
    name: Verify completed candidate-index receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-index-build-receipt
          path: imported
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35571453549
      - name: Validate full receipt and emit compact attestation
        run: python tools/verify_candidate_index_receipt.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-index-attestation
          path: results/candidate-index-attestation.json
          if-no-files-found: error
